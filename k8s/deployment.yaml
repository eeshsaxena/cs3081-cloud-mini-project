# Inference service Deployment in namespace "app" (Task 4).
# Build + import the image first:
#   docker build -f service/Dockerfile -t cloud-mini/service:v1 .
#   k3d image import cloud-mini/service:v1 -c cloud-mini
#
# Rolling update to v2 (Task 4, step 5):
#   kubectl -n app set env deployment/command-parser MODEL_VERSION=v2 MODEL_URI=s3://models/v2
# Roll back:
#   kubectl -n app rollout undo deployment/command-parser
apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-parser
  namespace: app
  labels: {app: command-parser}
spec:
  replicas: 2
  selector:
    matchLabels: {app: command-parser}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0        # keep full capacity during the rollout (<=0.5% failed requests)
      maxSurge: 1
  template:
    metadata:
      labels: {app: command-parser}
    spec:
      containers:
        - name: service
          image: cloud-mini/service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: MODEL_URI,      value: "s3://models/v1"}
            - {name: MODEL_VERSION,  value: "v1"}
            - {name: S3_ENDPOINT,    value: "http://seaweedfs.data.svc.cluster.local:8333"}
            - {name: MAX_NEW_TOKENS, value: "64"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: s3-credentials, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: s3-credentials, key: AWS_SECRET_ACCESS_KEY}}
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits:   {cpu: "1",    memory: "1Gi"}
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 30   # allow time for the model download at start-up (cold start)
